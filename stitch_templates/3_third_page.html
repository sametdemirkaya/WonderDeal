<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
  <style>
    @layer base{html,body{margin:0;padding:0;}body{overscroll-behavior:none;}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}
    ::-webkit-scrollbar{display:none;}
  </style>
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "on-background": "#d7e3fc",
            "tertiary-fixed-dim": "#b7c9d9",
            "tertiary-container": "#8193a2",
            "on-secondary-fixed-variant": "#364764",
            "outline-variant": "#414753",
            "on-error-container": "#ffdad6",
            "inverse-primary": "#005cba",
            "primary-container": "#448ffd",
            "primary-fixed-dim": "#abc7ff",
            "error-container": "#93000a",
            "background": "#071426",
            "inverse-on-surface": "#253144",
            "on-surface": "#d7e3fc",
            "surface-bright": "#2e3a4d",
            "on-secondary-fixed": "#071c36",
            "on-primary-container": "#002959",
            "surface-container-low": "#0f1c2e",
            "on-surface-variant": "#c1c6d5",
            "on-primary-fixed-variant": "#00458e",
            "surface-tint": "#abc7ff",
            "surface": "#071426",
            "on-tertiary-fixed-variant": "#384956",
            "outline": "#8b919f",
            "tertiary-fixed": "#d3e5f6",
            "surface-variant": "#293549",
            "on-secondary-container": "#a7b9db",
            "on-primary-fixed": "#001b3f",
            "surface-container-highest": "#293549",
            "on-primary": "#002f65",
            "surface-container-lowest": "#030e20",
            "secondary": "#b5c7ea",
            "surface-dim": "#071426",
            "on-tertiary-container": "#1b2b38",
            "surface-container": "#142032",
            "primary": "#abc7ff",
            "secondary-fixed-dim": "#b5c7ea",
            "error": "#ffb4ab",
            "secondary-container": "#384a67",
            "tertiary": "#b7c9d9",
            "surface-container-high": "#1e2a3d",
            "on-secondary": "#1f314d",
            "on-tertiary-fixed": "#0c1d29",
            "inverse-surface": "#d7e3fc",
            "secondary-fixed": "#d6e3ff",
            "on-tertiary": "#21323f",
            "primary-fixed": "#d7e3ff",
            "on-error": "#690005"
          },
          "borderRadius": {
            "DEFAULT": "0.125rem",
            "lg": "0.25rem",
            "xl": "0.5rem",
            "full": "0.75rem"
          },
          "spacing": {
            "space-xl": "2rem",
            "space-xs": "0.25rem",
            "space-lg": "1.5rem",
            "space-md": "0.75rem",
            "space-sm": "0.5rem",
            "sidebar-width-collapsed": "4rem",
            "space-2xl": "3rem",
            "sidebar-width-expanded": "16rem",
            "space-base": "1rem",
            "gutter-compact": "0.5rem",
            "gutter-spacious": "1.5rem",
            "gutter-default": "1rem",
            "space-2xs": "0.125rem"
          },
          "fontFamily": {
            "headline-xl": ["plusJakartaSans"],
            "headline-lg": ["plusJakartaSans"],
            "label-caps": ["jetbrainsMono"],
            "headline-sm": ["plusJakartaSans"],
            "data-metric-md": ["jetbrainsMono"],
            "body-sm": ["inter"],
            "body-md": ["inter"],
            "headline-md": ["plusJakartaSans"],
            "display-hero-mobile": ["plusJakartaSans"],
            "body-lg": ["inter"],
            "data-metric-sm": ["jetbrainsMono"],
            "data-metric-lg": ["jetbrainsMono"],
            "display-hero": ["plusJakartaSans"]
          }
        }
      }
    }
  </script>
</head>
<body class="bg-surface text-on-surface antialiased">
  <aside class="fixed left-0 top-0 bottom-0 w-60 z-50 flex flex-col justify-between bg-surface-container-low border-r border-outline-variant/30">
    <div class="flex flex-col w-full">
      <div class="h-16 px-space-base flex items-center gap-space-sm border-b border-outline-variant/20">
        <span class="font-headline-sm text-headline-sm uppercase tracking-wider text-on-surface font-semibold">WonderDeal</span>
      </div>
      <div class="px-space-base pt-space-md pb-space-xs">
        <span class="font-label-caps text-label-caps uppercase text-outline tracking-wider">Intelligence Workspace</span>
      </div>
      <nav class="flex flex-col gap-1 px-space-sm">
        <a class="relative flex items-center gap-space-sm px-space-md py-space-sm rounded-lg text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface transition-all font-body-md text-body-md" href="#">
          <span class="material-symbols-outlined text-outline text-[18px]">explore</span><span>Discover</span>
        </a>
        <a aria-current="page" class="relative flex items-center gap-space-sm px-space-md py-space-sm rounded-lg transition-all bg-secondary-container text-on-surface font-semibold before:absolute before:left-0 before:top-1.5 before:bottom-1.5 before:w-1 before:bg-primary-container before:rounded-r" href="#">
          <span class="material-symbols-outlined text-outline text-[18px]">radar</span><span>Scout</span>
        </a>
      </nav>
    </div>
  </aside>

  <div class="pl-60 min-h-screen flex flex-col bg-surface">
    <main class="w-full pt-16 flex-1 bg-surface">
      <div class="flex flex-col w-full px-space-xl pb-space-2xl gap-space-lg text-on-surface">
        <section class="flex flex-col lg:flex-row lg:items-end justify-between gap-space-md pt-space-md">
          <div class="flex flex-col gap-space-2xs">
            <h1 class="font-headline-xl text-headline-xl text-on-surface tracking-tight font-bold">Third Page Section</h1>
          </div>
        </section>
        
        <div class="sticky bottom-4 z-30 w-full mt-space-md">
          <div class="bg-surface-container-low/95 backdrop-blur-md px-space-lg py-space-sm rounded-xl border border-primary/40 shadow-xl flex flex-col md:flex-row items-center justify-between gap-space-md">
            <div class="flex items-center gap-space-sm w-full md:w-auto justify-end">
              <button class="font-label-caps text-label-caps text-outline hover:text-on-surface px-space-sm py-1.5 transition-colors">Clear Selection</button>
              <button class="h-9 px-space-lg bg-primary hover:bg-primary-container text-on-primary font-body-sm text-body-sm font-semibold rounded flex items-center gap-2 shadow-sm transition-all">
                <span>Compare</span>
                <span class="material-symbols-outlined text-[16px]">arrow_forward</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
